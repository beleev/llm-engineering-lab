name: Bug / 错误报告
description: 代码、公式、文档或网页的可复现问题 / Report a reproducible problem.
body:
  - type: input
    id: location
    attributes:
      label: 模块或页面 / Module or page
      placeholder: llm_infer/m02_paged_attention 或在线教程 URL
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 写出命令、输入或点击步骤。请勿粘贴密钥和私人数据。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 实际结果与预期 / Actual and expected behavior
      description: 可以附输出、断言错误或截图。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境 / Environment
      placeholder: 版本 tag 或 commit、操作系统、Python / NumPy / PyTorch 版本，或浏览器版本
