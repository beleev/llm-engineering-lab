name: Tests

# 每次 push / PR: 跑所有教学 demo 的冒烟测试, 并确认 Web 教程能构建。
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 是下限; 3.13 用来尽早发现被移除的标准库 API (例如 ast.Num)
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Smoke tests
        run: pytest
      - name: Training scripts
        run: pytest -m slow

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: 教程引用的 Python 源码符号都还在
        run: npm run check:sources
        working-directory: web
      - name: 公式都能被 KaTeX 解析, 没有漏掉的反斜杠
        run: npm run check:math
        working-directory: web
      - name: 自测题不能靠选项长度蒙对
        run: npm run check:quiz
        working-directory: web
      - run: npm run build
        working-directory: web
